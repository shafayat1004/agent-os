# Path policy for the agent-os repo itself (self-governance).
may_edit:
  - agentos
  - tests
  - bin
  - templates
  - hooks
  - examples
  - policies
  - evidence
  - skills
  - docs
  - .claude
  - .opencode
  - .github
  - .superpowers
  - "*.md"
  - .gitignore
  - STATE.yaml
  - VERSION
  - AGENTS.md
  - CLAUDE.md
# Spec and evidence-of-design docs change only with human sign-off.
ask_first:
  - SPEC.md
  - ROADMAP.md
  - WHITEPAPER.md
  - schemas
never: [_autogenerated_, "*.render", .git]
