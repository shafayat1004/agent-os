# Command policy skeleton. Gates shell tool invocations by command
# string before execution (issue #34). The Bash command string is the
# first concrete instance. This is the complement to path-policy.yaml:
# path-policy gates the file_path argument of edit tools; command-policy
# gates the command string of shell tools. One tool call can fire both.
#
# Each tool key is lowercase (Claude Code sends "Bash", opencode sends
# "bash"; a single lowercase key serves both). Under each tool:
#
#   deny:  a hard block (exit 2). Each entry is a regex (re.search) or a
#          mapping with pattern and an optional reason.
#   warn:  a non-blocking warning (exit 1). Same entry shape as deny.
#   allow: when set and non-empty, a command that matches no deny, no
#          warn, and no allow pattern is an outside-scope warning (exit 1).
#          When empty or absent, an unmatched command is allowed (exit 0).
#
# deny beats warn beats allow. An empty policy (the default below) lets
# every command through, so a new repository starts open.
tools:
  bash:
    deny: []
    # Example: block direct dotnet fable invocations.
    # deny:
    #   - pattern: 'dotnet\s+fable'
    #     reason: emits stray .fs.js files; use the build script
    warn: []
    allow: []
