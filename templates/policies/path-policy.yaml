# Path policy skeleton. The default lets the agent edit anything that
# ask_first or never does not match. Narrow may_edit as the repo grows rules.
may_edit: ["*"]
# ask_first: edits here need human sign-off before the agent proceeds.
# Example: ask_first: [migrations, deploy, "*.sql"]
ask_first: []
# never: a hard block. The agent must not write these paths.
never: [_autogenerated_, "*.render", .git]
