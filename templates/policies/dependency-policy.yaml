# Dependency policy skeleton. Name banned or required packages per repo.
# Example: banned: [{name: "left-pad", reason: "org rule"}]
banned: []
required: []
# ecosystems is informational. The scan reads manifest files of any kind.
ecosystems: []
# ignore: extra directory names to skip during the scan. Version control,
# vendored dependencies, and build output (node_modules, .git, bin, obj,
# dist, build, packages, and similar) are skipped by default.
ignore: []
