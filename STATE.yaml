task_id: issue-12-ledger-semantics
goal: Strengthen evidence-ledger semantics and criterion-to-proof linkage (issue #12), additive and versioned so legacy v0 entries stay valid
risk_class: reversible
scope_in: [agentos/checks/ledger.py, agentos/checks/state.py, agentos/cli.py, tests/test_ledger.py, tests/test_state.py, tests/fixtures/ledger_ok.ndjson, tests/fixtures/ledger_bad.ndjson, tests/fixtures/state_ok.yaml, STATE.yaml, evidence/ledger.ndjson, docs/]
