task_id: command-policy-34
goal: Add a tool-argument policy that gates shell command strings before execution, mirroring the path-policy contract. The Bash command string is the first concrete instance.
risk_class: reversible
scope_in: [agentos/checks/command.py, agentos/hooks.py, agentos/cli.py, agentos/initcmd.py, .opencode/plugins/agentos.js, templates/policies/command-policy.yaml, policies/command-policy.yaml, SPEC.md, VERSION, STATE.yaml, evidence/ledger.ndjson, tests/test_command_policy.py, tests/test_hook_commands.py, tests/test_init.py]
scope_out: [WHITEPAPER.md, ROADMAP.md, schemas/, hooks/pre-tool]
acceptance_criteria:
  - A policy file declares per-tool allow/deny command patterns.
  - agentos check-command classifies a command string and returns 2 on a denied match, 1 on a warned match, 0 otherwise.
  - The opencode plugin throws on a denied Bash command; the Claude Code PreToolUse wrapper exits 2 on a denied Bash command.
  - A missing or malformed policy fails open with a message, same as the path-policy contract.
  - Tests cover denied command blocked, warned command permitted with a trace, allowed command permitted, missing policy fails open, malformed policy fails open.
  - The relationship to #10 is documented: the two checks are complementary and both may fire on one tool call.
  - No third-party dependency added (stdlib only).
  - The full test suite passes and agentos all exits 0.
confirmed_facts: []
assumptions: []
decisions:
  - decision: regex patterns matched with re.search, not fnmatch globs
    rationale: command strings need word-boundary-aware matching (for example dotnet\s+fable), which fnmatch globs cannot express; re is stdlib and matches the grep -E behavior the subject hook already uses
  - decision: tool names are normalized to lowercase before policy lookup
    rationale: Claude Code sends "Bash" and opencode sends "bash"; a single lowercase policy key serves both harnesses
  - decision: an invalid regex fails open, same as a malformed YAML policy
    rationale: a guardrail that cannot parse its rules must not wedge the editor; the message tells the user which pattern is broken
  - decision: deny beats warn beats allow, and a non-empty allow list makes an unmatched command an outside-scope warning
    rationale: this mirrors the path-policy never/ask_first/may_edit tier order exactly
  - decision: bump the release version to 0.7.0 (minor, feature addition in the 0.x line)
    rationale: SPEC section 7 says a minor bump marks a feature addition; command gating is a new enforcement axis
