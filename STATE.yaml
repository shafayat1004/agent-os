task_id: ste-glossary-sync-05
goal: Update the ste-writing skill from the upstream agent-skills repo (glossary-backed terminology), add a regular check that decides whether a glossary update is necessary, document the discipline in SPEC, and bump the release to 0.5.0
risk_class: reversible
scope_in: [.claude/skills/ste-writing/, policies/custom-checks.yaml, skills/index.yaml, SPEC.md, VERSION, STATE.yaml, evidence/ledger.ndjson, tests/test_glossary_sync.py]
scope_out: [WHITEPAPER.md, ROADMAP.md, .opencode/plugins/agentos.js, agentos/]
acceptance_criteria:
  - the ste-writing skill ships the updated glossary.json, SKILL.md, and ste-lint.py from the upstream agent-skills repo
  - a provenance file pins the glossary content hash and the upstream source
  - a regular custom check in agentos all validates glossary integrity with no network call
  - an on-demand tool reports whether an upstream glossary update is necessary
  - SPEC documents the ste-writing skill data assets and the sync discipline
  - the full test suite passes and agentos all exits 0
  - agent-os 0.5.0 is tagged and released on GitHub
confirmed_facts:
  - fact: the ste-writing skill was vendored from the upstream agent-skills repo (commit 153ade3) and carries a 16-domain glossary, an expanded rule catalog, and a regex-or-spaCy linter
    evidence_ref: .claude/skills/ste-writing/SKILL.md, glossary.json, scripts/ste-lint.py
  - fact: the v0.4.0 task (issues-13-15-versioned-portable) shipped and merged (PR #40, tag v0.4.0); its seven criteria are retired to obsolete so their file-hash proofs go silent
    evidence_ref: STATE.yaml criteria status obsolete; git log commit cc4e982
  - fact: the glossary avoid entries use either a prefer field or a replacement field (both shapes exist in the upstream data), plus a reason and a source
    evidence_ref: .claude/skills/ste-writing/glossary.json domains go.javascript.avoid
assumptions: []
decisions:
  - decision: the regular glossary check is a custom check with on_fail warn, not a built-in validator check, because a stale glossary does not break the validator and the check must never block agentos done
    rationale: the six built-in checks are the normative spec surface; skill data integrity is a maintenance concern, so it belongs in policies/custom-checks.yaml where repos opt in
  - decision: the regular check makes no network call; it validates structure and compares the local content hash against a pinned provenance file, so it is deterministic and safe in tests and CI
    rationale: network in agentos all would make the suite non-deterministic and break offline; the upstream necessity comparison is a separate on-demand or CI-cron command
  - decision: the content hash excludes volatile metadata (the generated date and the note), so a metadata-only upstream change is not a necessary update
    rationale: an update is absolutely necessary only when normative term content changes, which is the question the user asked the check to answer
  - decision: bump the release version to 0.5.0 (minor, feature addition in the 0.x line)
    rationale: SPEC section 7 says a minor bump marks a feature addition; the glossary-sync check and the skill update are features
failed_hypotheses: []
open_questions:
  - should the glossary-sync check ship in templates/policies/custom-checks.yaml so target repos opt in by default, or stay agent-os-internal until a skill-vendor mechanism exists
