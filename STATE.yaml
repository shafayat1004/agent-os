task_id: v0.3-verdict-gates-and-trace-hooks
goal: Close the whitepaper on_stop gap (verdict gates plus optional test run) and add the post-tool trace and pre-compact advisory hooks
risk_class: reversible
scope_in: [agentos, tests, hooks, templates, schemas, SPEC.md, ROADMAP.md, README.md, AGENTS.md, .claude, .opencode, .gitignore, STATE.yaml, evidence]
scope_out: [examples, WHITEPAPER.md]
acceptance_criteria:
  - hook-stop refuses a done claim (exit 2) when stop_readiness is ready and acceptance_criteria is empty or any verification_status field is fail or pending
  - hook-stop --run-tests runs the configured command at a ready claim and refuses on a nonzero exit
  - hook-post-tool appends tool-call records to evidence/trace.ndjson and never blocks
  - hook-pre-compact prints the STATE refresh reminder and never blocks
  - init wires PostToolUse and PreCompact wrappers, settings entries, and the opencode tool.execute.after trace
  - the full test suite passes and agentos all exits 0 on the repo
confirmed_facts:
  - fact: the verdict gate fires only on stop_readiness ready, so mid-task stops and clarification pauses are never blocked
    evidence_ref: tests/test_hook_commands.py TestHookStopVerdict (blocked and absent cases exit 0)
  - fact: a ready claim with pending or fail verdicts, empty criteria, or a failing --run-tests command exits 2
    evidence_ref: tests/test_hook_commands.py TestHookStopVerdict plus fresh-init smoke run
  - fact: hook-post-tool and hook-pre-compact exit 0 on malformed input and unwritable paths
    evidence_ref: tests/test_hook_commands.py TestHookPostTool and TestHookPreCompact
  - fact: init writes all four Claude Code wrappers, the settings entries, and the opencode trace handler; generated plugin parses under node --check
    evidence_ref: tests/test_init.py plus fresh-init smoke run
  - fact: 134 of 134 tests pass and agentos all exits 0 on the repo
    evidence_ref: python3 -m unittest discover -s tests and ./bin/agentos all output
assumptions: []
decisions:
  - decision: the verdict gate triggers on the stop_readiness field, not on every stop
    rationale: Stop fires on every turn end; gating unconditionally would block mid-task clarification pauses, which the whitepaper protects
  - decision: --run-tests is adapter wiring, not a validator default
    rationale: only the repo knows its test command; greenfield inits ship without it and keep the self-reported verdict layer
  - decision: the post-tool hook records a raw trace line, not a ledger entry
    rationale: fact extraction is model work; the trace is deterministic instrumentation that feeds the context-accounting roadmap gate
  - decision: on_retry and context-load hooks stay unbuilt
    rationale: no harness exposes those events; they belong to the workflow state-machine and context-accounting roadmap items
failed_hypotheses: []
open_questions: []
