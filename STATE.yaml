acceptance_criteria:
  - empty or malformed ledger entries are rejected (v1 entries)
  - every required acceptance criterion has a confirmed ledger proof (when STATE declares criteria)
  - file references in v1 entries resolve or warn; hash mismatch on a file ref warns
  - stale evidence (ts before task_started) is detected when task_started is set
  - confirmed v1 entries require a verifier; test/tool v1 entries require a non-empty hash
  - legacy v0 entries stay valid (no retroactive break of the repo 73-line ledger)
  - the repo migrates its own current task to v1 so the self-governance gate exercises the new bar
  - full suite passes and agentos all exits 0
confirmed_facts:
  - fact: the evidence schema today requires claim, status, evidence_ref, source_type, ts; verifier and hash are optional; additionalProperties is false; there is no non-empty, timestamp-format, hash, or criterion linkage constraint
    evidence_ref: schemas/evidence.schema.json
  - fact: the ledger check (agentos/checks/ledger.py) only runs jsonschema_min per line; there is no semantic layer and no cross-reference to STATE
    evidence_ref: agentos/checks/ledger.py
  - fact: acceptance_criteria in task-state.schema.json is a bare [string] list with no id and no proof reference; confirmed_facts is [{fact, evidence_ref}] but is not linked to acceptance_criteria
    evidence_ref: schemas/task-state.schema.json
  - fact: jsonschema_min supports type, enum, pattern, required, additionalProperties, minItems; it has no minLength, format, or custom keywords; AGENTS.md forbids weakening it and it must raise on unsupported input
    evidence_ref: agentos/jsonschema_min.py
  - fact: the repo's own 73-line ledger has v0-shape entries (no version field; confirmed entries with no hash; verifier empty on some); any retroactive strictness would break the self-governance gate and AGENTS.md forbids weakening a test to make a failing repo pass
    evidence_ref: evidence/ledger.ndjson
  - fact: the done gate (hooks.py run_done) already refuses the claim (exit 2) on any error-level ledger finding, so strengthening the ledger check propagates into the done gate with no hooks.py change
    evidence_ref: agentos/hooks.py run_done lines 219-226
assumptions: []
decisions:
  - decision: criterion linkage uses stable ids in STATE criteria, not exact acceptance_criteria text match
    rationale: ids survive rewording; text match breaks on whitespace and wording drift (user-approved DECISION 2)
  - decision: drift (file-resolve, hash-mismatch, stale) severity is tiered by liveness, not flat
    rationale: a live proof of an active criterion that has drifted blocks done (error); a free-standing fact drifts to a warning; a superseded or obsolete-criterion entry is silent history. Warnings clear via append-only supersession (a fresh v1 entry with supersedes) or criterion retirement (status: obsolete), so they never become permanent false flags (user-approved DECISION 4 refined)
  - decision: v0 entries are transitional, not permanent; migration is append-only supersession by line number or id
    rationale: the target is all live entries v1; the repo's 73 legacy lines stay valid as inert v0 and are superseded only as their areas are touched (user-approved choice a)
