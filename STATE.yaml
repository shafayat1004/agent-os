task_id: verifier-content-asserts-35
goal: Add first-class content assertions (contains/excludes) to verification.yaml so a verifier that exits 0 without doing the work is caught; the ledger records the failed pattern, not just an exit code
risk_class: reversible
scope_in: [agentos/verify.py, agentos/initcmd.py, SPEC.md, VERSION, STATE.yaml, evidence/ledger.ndjson, tests/test_verify.py]
scope_out: [WHITEPAPER.md, ROADMAP.md, schemas/, .opencode/plugins/agentos.js, agentos/hooks.py, agentos/cli.py]
acceptance_criteria:
  - verification.yaml supports an assert block per verifier with contains and excludes lists
  - a zero exit with a failed contains (missing pattern) marks the verifier fail
  - a zero exit with a matched excludes (forbidden pattern present) marks the verifier fail
  - the ledger records the failed pattern in evidence_ref, not just an exit code
  - agentos done refuses the claim on a failed assert, same as on a nonzero exit
  - tests cover pass exit plus pass assert, pass exit plus failed contains, pass exit plus matched excludes, timeout, and the full-rewrite writeback of a derived fail
  - existing single-command configs with no assert block behave identically (no regression to #9)
  - no third-party dependency added (stdlib only)
confirmed_facts: []
assumptions: []
decisions:
  - decision: each verifier value in commands can be a string (the #9 shape, backward compatible) or a mapping with command and assert keys
    rationale: a mapping shape keeps the assert block next to the command it belongs to; a plain string preserves the existing config so no repo must migrate
  - decision: a nonzero exit is still fail and the assert is not checked when the command already failed
    rationale: the assert guards against a false green (exit 0 without the work); a nonzero exit is already a true fail, so the assert adds no signal there
  - decision: a failed assert writes the specific pattern into evidence_ref (assert missing: "pattern" or assert forbidden: "pattern")
    rationale: the ledger must record why the verifier failed, not just that it failed; this gives #12 a concrete evidence_ref to link to an acceptance criterion
  - decision: bump the release version to 0.6.0 (minor, feature addition in the 0.x line)
    rationale: SPEC section 7 says a minor bump marks a feature addition; content assertions are a new feature
