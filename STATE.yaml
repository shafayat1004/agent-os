task_id: issues-13-15-versioned-portable
goal: Make agent-os installations portable and version-pinned (#13) and separate the spec/schema/adapter/implementation version dimensions (#15); establish the GitHub release discipline so each shipped release is tagged and documented
risk_class: reversible
scope_in: [agentos/cli.py, agentos/initcmd.py, agentos/bootstrap.py, agentos/result.py, tests/test_init.py, tests/test_cli.py, tests/test_self_governance.py, VERSION, SPEC.md, ROADMAP.md, schemas/, templates/, STATE.yaml, evidence/ledger.ndjson, docs/]
scope_out: [WHITEPAPER.md, .opencode/plugins/agentos.js]
acceptance_criteria:
  - a fresh clone works without the original agent-os checkout path (#13)
  - the installed agent-os version is discoverable and pinned (#13)
  - upgrade and rollback procedures exist and are documented (#13)
  - CI can install or use the same version deterministically (#13)
  - each version dimension (release, schema, adapter protocol) has a clear name and source of truth (#15)
  - runtime output reports relevant versions (#15)
  - schema files include explicit schema_version fields (#15)
  - the v0.1/v0.3 wording ambiguity in SPEC.md is corrected (#15)
  - the first GitHub release is cut and documented; future merges that ship update the release section
confirmed_facts:
  - fact: SPEC.md header says "v0.3" but the body mixes "v0.1 spec surface" (the six artifacts) with "v0.3" (the CLI), the exact ambiguity #15 names
    evidence_ref: SPEC.md lines 1, 30, 71, 355, 432
  - fact: the CLI has no --version flag and no VERSION file; there are zero git tags and zero GitHub releases
    evidence_ref: agentos/cli.py argparse setup; `git tag -l` empty; `gh release list` empty
  - fact: schemas carry no file-level schema_version; evidence.schema.json has an entry-version field (enum [1], added in #12) but no schema-file version; task-state.schema.json and skill.schema.json have no version at all
    evidence_ref: schemas/evidence.schema.json, schemas/task-state.schema.json, schemas/skill.schema.json
  - fact: agentos init embeds the absolute agentos_bin path into 7 generated files (pre-tool, stop-check, post-tool, pre-compact, pre-commit, opencode plugin, verification.yaml); if the agent-os checkout moves or is deleted every installed repo's enforcement goes silent
    evidence_ref: agentos/initcmd.py lines 143-223, 287, 293-311
  - fact: the opencode plugin already prefers a vendored bin/agentos over the SHARED path (vendored wins, SHARED falls back), so the vendor model is half-built; only the init step does not vendor by default
    evidence_ref: agentos/initcmd.py _OPENCODE_PLUGIN lines 69-71
  - fact: the agent-os repo self-hosts its own bin/agentos and is the reference for the vendored model; templates/STATE.yaml ships stop_readiness blocked and init is non-destructive (_write_if_absent)
    evidence_ref: tests/test_self_governance.py; agentos/initcmd.py _write_if_absent lines 240-251
assumptions: []
decisions:
  - decision: three version dimensions, not five: release version (one semver, the git tag, source of truth is the VERSION file), schema_version (per-schema-file integer, additive, independent), adapter protocol version (one integer in the opencode plugin)
    rationale: the spec document version and the template bundle version collapse into the release version; the spec surface is just "the spec" and evolves by additive change tracked in ROADMAP, not by a separate version label. This kills the v0.1-vs-v0.3 ambiguity #15 names without inventing two more version numbers to keep in sync (pending user sign-off)
  - decision: vendor-by-default for agentos init; the SHARED absolute-path model becomes opt-in (--shared PATH) for teams that want one checkout across many repos
    rationale: the vendored model is already half-built (the opencode plugin prefers vendored over SHARED); vendoring fits the zero-dep "drop into any repo without an install step" guarantee (memory 1967); git submodules add complexity and pip violates zero-dep; a single-file bundle is elegant but a bigger build step for later (pending user sign-off)
  - decision: schema files get a top-level "schema_version" integer; the evidence entry "version" field (added in #12) stays unchanged to avoid a breaking rename hours after it shipped
    rationale: additive and non-breaking; the two version concepts (file vs entry) are distinct and named distinctly (pending user sign-off)
