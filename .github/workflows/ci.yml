name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run on the same ref so a fast push does not queue
# behind a slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run agent-os self-validation
        run: ./bin/agentos all

  adapter-syntax:
    name: adapter syntax (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the opencode adapter parses
        run: node --check .opencode/plugins/agentos.js
