name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run on the same ref so a fast push does not queue
# behind a slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run agent-os self-validation
        # agentos all exits nonzero when stop_readiness is blocked and
        # criteria are uncovered (mid-task). Accept exit 1 in that state
        # as long as only the ledger check fails (uncovered criteria);
        # any other check failing is a real break.
        run: |
          set +e
          ./bin/agentos all > /tmp/agentos-output.txt 2>&1
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            exit 0
          fi
          if grep -q "stop_readiness: blocked" STATE.yaml; then
            # Mid-task: only the ledger check may fail (uncovered criteria)
            if grep -q "FAIL.*ledger" /tmp/agentos-output.txt && \
               ! grep -E "FAIL.*state|FAIL.*diff|FAIL.*deps|FAIL.*skills|FAIL.*rules|FAIL.*custom" /tmp/agentos-output.txt | grep -v "ledger"; then
              echo "Mid-task state: ledger check fails on uncovered criteria (expected)"
              cat /tmp/agentos-output.txt
              exit 0
            fi
          fi
          cat /tmp/agentos-output.txt
          exit $exit_code

  adapter-syntax:
    name: adapter syntax (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the opencode adapter parses
        run: node --check .opencode/plugins/agentos.js
